name: Korean subtitle check (manual)
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/test/ko_subs.py https://mrjkorea.github.io/ news-korean.png
      - uses: actions/upload-artifact@v4
        with: { name: shot, path: news-korean.png }
