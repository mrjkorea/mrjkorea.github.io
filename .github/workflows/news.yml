name: Refresh news list
on:
  schedule: [{ cron: "30 22 * * *" }, { cron: "15 */2 * * *" }]   # 07:30 KST (just after the ~07:10 upload) + every 2 h for late uploads
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/build_news.py
      - run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update news list" && git push)
